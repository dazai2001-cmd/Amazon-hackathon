name: Verify Earned Valor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:production
      - name: Use the runner's installed Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the Fire TV APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EarnedValor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
